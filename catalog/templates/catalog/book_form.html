{% extends "catalog/base.html" %}
{% load i18n %}

{% block content %}

<h1>{% trans "Book Form" %}</h1>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-success">
        {% trans "Save" %}
    </button>

    <a href="{% url 'catalog:book_list' %}"
       class="btn btn-secondary">
        {% trans "Cancel" %}
    </a>
</form>

{% endblock %}
