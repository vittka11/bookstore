{% load i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bookstore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="{% url 'catalog:book_list' %}">
            Bookstore
        </a>

        <a class="btn btn-success"
           href="{% url 'catalog:book_create' %}">
           {% trans "Add book" %}
           <form action="{% url 'set_language' %}" method="post" class="me-3">
    {% csrf_token %}
    <input name="next" type="hidden" value="{{ request.path }}">
    <select name="language" onchange="this.form.submit()">
        {% get_current_language as LANGUAGE_CODE %}
        {% get_available_languages as LANGUAGES %}

        {% for language_code, language_name in LANGUAGES %}
            <option value="{{ language_code }}"
                    {% if language_code == LANGUAGE_CODE %}selected{% endif %}>
                {{ language_name }}
            </option>
        {% endfor %}
    </select>
</form>
            {% if user.is_authenticated %}
    <span class="text-white me-2">
        {% trans "Hello" %}, {{ user.username }}
    </span>

    <form method="post"
          action="{% url 'accounts:logout' %}"
          style="display:inline;">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-light">
            {% trans "Logout" %}
        </button>
    </form>

{% else %}
    <a href="{% url 'accounts:login' %}"
       class="btn btn-outline-light">
        {% trans "Login" %}
    </a>

    <a href="{% url 'accounts:register' %}"
       class="btn btn-success">
        {% trans "Register" %}
    </a>
{% endif %}
    
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
